name: Automated Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t fenjan-cafe-dashboard:test .

      - name: Start Docker container
        run: |
          docker run -d \
            --name fenjan-cafe-dashboard-test \
            -p 8501:8501 \
            fenjan-cafe-dashboard:test

      - name: Test container health
        run: |
          timeout 60 bash -c \
            'until curl --fail --silent http://localhost:8501/_stcore/health; do sleep 2; done'

      - name: Show container logs
        if: always()
        run: docker logs fenjan-cafe-dashboard-test